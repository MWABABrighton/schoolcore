<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Report Card</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            text-align: center;
        }

        .student-info {
            margin-bottom: 30px;
        }

        .student-info p {
            margin: 5px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #000;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>

    <h1>Student Report Card</h1>

    <div class="student-info">
        <p>
            <strong>Student Number:</strong>
            {{ student.student_number }}
        </p>

        <p>
            <strong>Name:</strong>
            {{ student.first_name }}
            {{ student.middle_name }}
            {{ student.last_name }}
        </p>

        <p>
            <strong>Gender:</strong>
            {{ student.get_gender_display }}
        </p>

        <p>
            <strong>Date of Birth:</strong>
            {{ student.date_of_birth }}
        </p>
    </div>

    <table>
        <thead>
            <tr>
                <th>Subject</th>
                <th>Marks</th>
                <th>Remarks</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td colspan="3">
                    Results will appear here.
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
