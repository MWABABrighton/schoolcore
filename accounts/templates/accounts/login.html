<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Login | SchoolCore</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body style="background-color: #212529;"></body>


<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-5 col-lg-4">

            <div class="card shadow-sm mt-5">

                <div class="card-body p-4">

                    <div class="text-center mb-4">

                        <h2>SchoolCore</h2>

                        <p class="text-muted">
                            School Management & Academic Information System
                        </p>

                    </div>


                    <h4 class="mb-3">
                        Login
                    </h4>


                    {% if form.errors %}

                        <div class="alert alert-danger">

                            Invalid username or password.

                        </div>

                    {% endif %}


                    <form method="post">

                        {% csrf_token %}


                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                required
                                autofocus
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required
                            >

                        </div>


                       <button
                            type="submit"
                            class="btn w-100 text-white"
                            style="background-color: #212529;"
                        >
                            Login
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


</body>

</html>
