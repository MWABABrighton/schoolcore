{% extends "base.html" %}

{% block title %}
    Login - SchoolCore
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5 col-lg-4">

        <div class="card shadow-sm border-0">

            <div class="card-body p-4">

                <div class="text-center mb-4">

                    <h2>SchoolCore</h2>

                    <p class="text-muted mb-0">
                        Sign in to your account
                    </p>

                </div>


                {% if form.errors %}

                    <div class="alert alert-danger">
                        Invalid username or password.
                    </div>

                {% endif %}


                <form method="post">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label
                            for="{{ form.username.id_for_label }}"
                            class="form-label"
                        >
                            Username
                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            id="{{ form.username.id_for_label }}"
                            required
                            autofocus
                        >

                    </div>


                    <div class="mb-3">

                        <label
                            for="{{ form.password.id_for_label }}"
                            class="form-label"
                        >
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            id="{{ form.password.id_for_label }}"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Login
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
