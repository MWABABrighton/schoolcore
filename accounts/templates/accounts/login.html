<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Login | SchoolCore</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --page-bg: #ffffff; /* outer background now white */
            --bg-dark: #212529;
            --bg-dark-2: #181b1e;
            --panel: rgba(255, 255, 255, 0.06);
            --panel-strong: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --muted: rgba(255, 255, 255, 0.72);
            --input-bg: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.08);
            --shadow: rgba(0, 0, 0, 0.28);
            --card-max-width: 420px; /* ensure card fits on desktop */
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: 'Inter', sans-serif;
            background: var(--page-bg); /* changed to white */
            color: #212529; /* page text color when visible */
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
        }

        .login-shell {
            width: 100%;
            max-width: var(--card-max-width);
            margin: 0 auto;
        }

        .login-card {
            background: linear-gradient(180deg, rgba(33,37,41,0.95), rgba(24,27,30,0.98));
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            box-shadow: 0 18px 45px rgba(0,0,0,0.18);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            overflow: hidden;
            /* keep card height within viewport on large screens */
            max-height: calc(100vh - 80px);
        }

        /* make inner content scrollable if needed */
        .login-card .card-body {
            padding: 1.25rem 1rem;
            overflow: auto;
        }

        .brand {
            text-align: center;
            margin-bottom: 1rem;
        }

        .brand-mark {
            width: 56px;
            height: 56px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
        }

        .brand-mark svg {
            opacity: 0.98;
        }

        .brand h2 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text);
        }

        .brand p {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 0.9rem;
            line-height: 1.3;
        }

        .welcome-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text);
            margin: 0 0 0.25rem;
        }

        .welcome-subtitle {
            color: var(--muted);
            margin: 0 0 1rem;
            font-size: 0.9rem;
        }

        .alert {
            border: none;
            border-radius: 10px;
            background: rgba(220, 53, 69, 0.12);
            color: #ffd7dc;
            padding: 0.65rem 0.9rem;
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }

        .form-label {
            font-size: 0.82rem;
            font-weight: 600;
            color: rgba(255,255,255,0.9);
            margin-bottom: 0.45rem;
        }

        .form-control {
            width: 100%;
            height: 44px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.02);
            color: var(--text);
            padding: 0.65rem 0.75rem;
            outline: none;
            box-shadow: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
            font-size: 0.95rem;
        }

        .form-control::placeholder {
            color: rgba(255,255,255,0.42);
        }

        .form-control:focus {
            border-color: rgba(255,255,255,0.18);
            background: rgba(255,255,255,0.03);
            box-shadow: 0 0 0 0.2rem rgba(255,255,255,0.04);
            color: var(--text);
        }

        .form-check-input {
            width: 1rem;
            height: 1rem;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.02);
        }

        .form-check-input:checked {
            background-color: #ffffff;
            border-color: #ffffff;
        }

        .form-check-label,
        .secondary-link {
            color: rgba(255,255,255,0.8);
            font-size: 0.86rem;
            text-decoration: none;
        }

        .secondary-link:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            height: 44px;
            background: linear-gradient(180deg, #f4f4f4 0%, #eaeaea 100%);
            color: var(--bg-dark);
            border: none;
            border-radius: 10px;
            font-weight: 700;
            letter-spacing: 0.01em;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            font-size: 0.95rem;
        }

        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.14);
        }

        .divider {
            position: relative;
            margin: 1.25rem 0 0.75rem;
            text-align: center;
            color: rgba(255,255,255,0.45);
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .divider::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 1px;
            background: rgba(255,255,255,0.06);
        }

        .divider span {
            position: relative;
            display: inline-block;
            padding: 0 0.75rem;
            background: transparent;
        }

        .register-text {
            text-align: center;
            color: rgba(255,255,255,0.8);
            font-size: 0.88rem;
            margin: 0.5rem 0 0;
        }

        .register-text a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        @media (min-width: 1100px) {
            /* keep the card comfortably within large desktop viewports */
            .login-shell { max-width: 420px; }
        }

    </style>

</head>

<body>

<div class="login-shell">
    <div class="card login-card shadow-sm">
        <div class="card-body p-4">

            <div class="brand">
                <div class="brand-mark" aria-hidden="true">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="3" y="4" width="18" height="12" rx="2.5" stroke="white" stroke-width="1.7"/>
                        <path d="M7 20H17" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
                        <path d="M8 8H16" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
                        <path d="M8 11H13" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
                    </svg>
                </div>
                <h2>SchoolCore</h2>
                <p>School Management &amp; Academic Information System</p>
            </div>

            <h4 class="welcome-title">Login</h4>
            <p class="welcome-subtitle">Welcome back! Please sign in to continue.</p>

            {% if form.errors %}
                <div class="alert" role="alert">
                    Invalid username or password.
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input
                        id="username"
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Enter your username"
                        required
                        autofocus
                    >
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input
                        id="password"
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">Remember me</label>
                    </div>
                    <a href="#" class="secondary-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-login">
                    Login
                </button>
            </form>

            <div class="divider"><span>or</span></div>

            <p class="register-text">Need help? <a href="#">Contact admin</a></p>

        </div>
    </div>
</div>

</body>

</html>
