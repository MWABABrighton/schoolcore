<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Login | SchoolCore</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --page-bg: #ffffff; /* outer background white */
            --dark-bg: #212529; /* card accent */
            --panel-strong: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --muted: rgba(255, 255, 255, 0.72);
            --input-bg: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.06);
            --shadow: rgba(0, 0, 0, 0.18);
            --card-max-width: 360px; /* smaller card so it fits easily */
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: var(--page-bg);
            color: #212529;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px; /* reduced padding so card fits */
        }

        .login-shell {
            width: 100%;
            max-width: var(--card-max-width);
            margin: 0 auto;
        }

        .login-card {
            background: linear-gradient(180deg, rgba(33,37,41,0.98), rgba(24,27,30,0.98));
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 10px 28px var(--shadow);
            overflow: visible; /* ensure the card itself doesn't clip content */
        }

        .login-card .card-body {
            padding: 1rem; /* smaller padding */
            overflow: visible; /* prevent inner scroll */
        }

        .brand { text-align: center; margin-bottom: 0.8rem; }

        .brand-mark {
            width: 46px;
            height: 46px;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
        }

        .brand h2 {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--text);
        }

        .brand p { margin: 4px 0 0; color: var(--muted); font-size: 0.82rem; }

        .welcome-title { font-size: 1rem; font-weight: 700; color: var(--text); margin: 0 0 0.2rem; }
        .welcome-subtitle { color: var(--muted); margin: 0 0 0.9rem; font-size: 0.85rem; }

        .alert { border: none; border-radius: 8px; background: rgba(220,53,69,0.12); color: #ffd7dc; padding: 0.6rem 0.8rem; margin-bottom: 0.85rem; font-size: 0.9rem; }

        .form-label { font-size: 0.8rem; font-weight: 600; color: rgba(255,255,255,0.92); margin-bottom: 0.4rem; }

        .form-control {
            width: 100%; height: 42px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.06);
            background: var(--input-bg); color: var(--text); padding: 0.55rem 0.65rem; font-size: 0.92rem;
        }

        .form-control::placeholder { color: rgba(255,255,255,0.42); }
        .form-control:focus { border-color: rgba(255,255,255,0.12); box-shadow: 0 0 0 0.15rem rgba(255,255,255,0.03); }

        .form-check-input { width: 1rem; height: 1rem; }
        .form-check-label, .secondary-link { color: rgba(255,255,255,0.82); font-size: 0.85rem; }

        .btn-login { width: 100%; height: 42px; background: linear-gradient(180deg,#f4f4f4 0%,#eaeaea 100%); color: var(--dark-bg); border-radius: 8px; font-weight: 700; font-size: 0.95rem; }
        .btn-login:hover { transform: translateY(-1px); }

        .divider { margin: 1rem 0 0.6rem; text-align: center; color: rgba(255,255,255,0.45); font-size: 0.72rem; }
        .divider::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(255,255,255,0.06); }
        .divider span { position: relative; display: inline-block; padding: 0 0.5rem; background: transparent; }

        .register-text { text-align: center; color: rgba(255,255,255,0.82); font-size: 0.86rem; margin: 0.4rem 0 0; }

        /* If the viewport is extremely short, slightly reduce spacing further */
        @media (max-height: 560px) {
            body { padding: 10px; }
            .brand-mark { width: 40px; height: 40px; }
            .brand p, .welcome-subtitle { font-size: 0.78rem; }
            .login-card .card-body { padding: 0.75rem; }
            .divider { margin-top: 0.8rem; }
        }

    </style>

</head>

<body>

<div class="login-shell">
    <div class="card login-card shadow-sm">
        <div class="card-body">

            <div class="brand">
                <div class="brand-mark" aria-hidden="true">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="3" y="4" width="18" height="12" rx="2.5" stroke="white" stroke-width="1.6"/>
                        <path d="M7 20H17" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
                        <path d="M8 8H16" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
                    </svg>
                </div>
                <h2>SchoolCore</h2>
                <p>School Management &amp; Academic Information System</p>
            </div>

            <h4 class="welcome-title">Login</h4>
            <p class="welcome-subtitle">Welcome back — sign in to continue.</p>

            {% if form.errors %}
                <div class="alert" role="alert">Invalid username or password.</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="mb-2">
                    <label for="username" class="form-label">Username</label>
                    <input id="username" type="text" name="username" class="form-control" placeholder="Enter your username" required autofocus>
                </div>

                <div class="mb-2">
                    <label for="password" class="form-label">Password</label>
                    <input id="password" type="password" name="password" class="form-control" placeholder="Enter your password" required>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-2">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">Remember me</label>
                    </div>
                    <a href="#" class="secondary-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-login mb-1">Login</button>
            </form>

            <div class="divider" aria-hidden="true"><span>or</span></div>
            <p class="register-text">Need help? <a href="#">Contact admin</a></p>

        </div>
    </div>
</div>

</body>

</html>
