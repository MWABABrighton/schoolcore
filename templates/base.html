<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            SchoolCore
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        /* Make all buttons dark/black and compact */
        button,
        .btn,
        input[type="submit"],
        input[type="button"],
        a.btn {
            background-color: #000 !important;
            color: #fff !important;
            border-color: #000 !important;

            /* compact sizing */
            padding: 0.25rem 0.5rem !important;
            font-size: 0.875rem !important;
            line-height: 1.2 !important;

            /* slight rounding */
            border-radius: 0.35rem !important;

            /* visual polish */
            box-shadow: none !important;
            transition: background-color 120ms ease, transform 80ms ease;
        }

        /* Hover: slightly darker and lift */
        button:hover,
        .btn:hover,
        input[type="submit"]:hover,
        input[type="button"]:hover,
        a.btn:hover {
            background-color: #111 !important;
            transform: translateY(-1px) !important;
            color: #fff !important;
        }

        /* Active / focus: a little deeper */
        button:active,
        .btn:active,
        input[type="submit"]:active,
        input[type="button"]:active,
        a.btn:active,
        button:focus,
        .btn:focus,
        input[type="submit"]:focus,
        input[type="button"]:focus,
        a.btn:focus {
            background-color: #222 !important;
            outline: none !important;
            box-shadow: none !important;
        }

        /* Ensure the logout button (a button with .nav-link) looks like the other buttons */
        button.nav-link {
            background-color: #000 !important;
            color: #fff !important;
            border: none !important;
            padding: 0.25rem 0.5rem !important;
            border-radius: 0.35rem !important;
            transition: background-color 120ms ease, transform 80ms ease;
        }

        button.nav-link:hover {
            background-color: #111 !important;
            transform: translateY(-1px) !important;
            color: #fff !important;
        }
    </style>

</head>


<body class="bg-light">


<!-- Top Navigation Bar -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container-fluid">

        <a
            class="navbar-brand fw-bold"
            href="/dashboard/"
        >
            SchoolCore
        </a>

        <span class="navbar-text text-white">
            School Management & Academic Information System
        </span>


        {% if user.is_authenticated %}

            <span class="text-white me-3">
                {{ user.first_name }} {{ user.last_name }}
            </span>

        {% endif %}

    </div>

</nav>


<!-- Main Layout -->

<div class="container-fluid">

    <div class="row">


        <!-- Sidebar -->

        <aside class="col-md-2 bg-dark text-white min-vh-100 p-3">

            <h5 class="mb-4">
                Navigation
            </h5>


            <div class="nav flex-column">


                <!-- Dashboard -->

                <a
                    href="/dashboard/"
                    class="nav-link text-white"
                >
                    Dashboard
                </a>


                <!-- Students -->

                <a
                    href="/students/"
                    class="nav-link text-white"
                >
                    Students
                </a>


                <!-- Teachers -->

                <a
                    href="{% url 'teacher_list' %}"
                    class="nav-link text-white"
                >
                    Teachers
                </a>


                <!-- Academics -->

                <a
                    href="{% url 'academics_home' %}"
                    class="nav-link text-white"
                >
                    Academics
                </a>


                <!-- Attendance -->
<a href="{% url 'attendance_home' %}" class="nav-link text-white">
    Attendance
</a>
                <!-- Assessments -->

            <a href="/assessments/" class="nav-link text-white">
                Assessments
            </a>


                <!-- Reports -->

                <a
                    href="/reports/"
                    class="nav-link text-white"
                >
                    Reports
                </a>
                <a
                    href="/finance/"
                    class="nav-link text-white"
                >
                    Payments
                </a>


                <!-- Logout -->

                <li class="nav-item">

                    <form
                        method="post"
                        action="{% url 'logout' %}"
                    >

                        {% csrf_token %}

                        <button
                            type="submit"
                            class="nav-link text-white border-0 bg-transparent"
                        >
                            Logout
                        </button>

                    </form>

                </li>


            </div>

        </aside>


        <!-- Main Content -->

        <main class="col-md-10 p-4">

            {% block content %}
            {% endblock %}

        </main>


    </div>

</div>


<!-- Bootstrap JavaScript -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
