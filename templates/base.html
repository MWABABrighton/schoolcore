<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            SchoolCore
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


<!-- Top Navigation Bar -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container-fluid">

        <a
            class="navbar-brand fw-bold"
            href="/dashboard/"
        >
            SchoolCore
        </a>

        <span class="navbar-text text-white">
            School Management & Academic Information System
        </span>


        {% if user.is_authenticated %}

            <span class="text-white me-3">
                {{ user.first_name }} {{ user.last_name }}
            </span>

        {% endif %}

    </div>

</nav>


<!-- Main Layout -->

<div class="container-fluid">

    <div class="row">


        <!-- Sidebar -->

        <aside class="col-md-2 bg-dark text-white min-vh-100 p-3">

            <h5 class="mb-4">
                Navigation
            </h5>


            <div class="nav flex-column">


                <!-- Dashboard -->

                <a
                    href="/dashboard/"
                    class="nav-link text-white"
                >
                    Dashboard
                </a>


                <!-- Students -->

                <a
                    href="/students/"
                    class="nav-link text-white"
                >
                    Students
                </a>


                <!-- Teachers -->

                <a
                    href="{% url 'teacher_list' %}"
                    class="nav-link text-white"
                >
                    Teachers
                </a>


                <!-- Academics -->

                <a
                    href="{% url 'academics_home' %}"
                    class="nav-link text-white"
                >
                    Academics
                </a>


                <!-- Attendance -->
<a href="{% url 'attendance_home' %}" class="nav-link text-white">
    Attendance
</a>
                <!-- Assessments -->

            <a href="/assessments/" class="nav-link text-white">
                Assessments
            </a>


                <!-- Reports -->

                <a
                    href="/reports/"
                    class="nav-link text-white"
                >
                    Reports
                </a>
                <a
                    href="/finance/"
                    class="nav-link text-white"
                >
                    Payments
                </a>


                <!-- Logout -->

                <li class="nav-item">

                    <form
                        method="post"
                        action="{% url 'logout' %}"
                    >

                        {% csrf_token %}

                        <button
                            type="submit"
                            class="nav-link text-white border-0 bg-transparent"
                        >
                            Logout
                        </button>

                    </form>

                </li>


            </div>

        </aside>


        <!-- Main Content -->

        <main class="col-md-10 p-4">

            {% block content %}
            {% endblock %}

        </main>


    </div>

</div>


<!-- Bootstrap JavaScript -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
