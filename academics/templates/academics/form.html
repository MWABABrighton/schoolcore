{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <div class="mb-4">
        <h3>{{ title }}</h3>
    </div>

    <div class="card">

        <div class="card-body">

            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-primary">
                    Save
                </button>

                <a href="{% url 'academics_home' %}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
